name: Android CI

on:
  push:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_NEXT_KEYSTORE_PASSWORD }}
      MOJOPUB_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_NEXT_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init submodules + PanVK loader overlay
        run: |
          set -e
          git submodule sync || true
          git submodule update --init --force --depth=1 NoBlocklist glfw sdl || true
          rm -rf mojoexec
          git clone --depth=1 https://github.com/MojoLauncher/mojoexec.git mojoexec
          curl -fL -o mojoexec/vulkan_loader.c \
            https://raw.githubusercontent.com/TheoLore/mojoexec/main/vulkan_loader.c
          curl -fL -o mojoexec/CMakeLists.txt \
            https://raw.githubusercontent.com/TheoLore/mojoexec/main/CMakeLists.txt
          curl -fL -o mojoexec/jni_bindings/src/main/java/git/artdeell/mojoexec/MojoExec.java \
            https://raw.githubusercontent.com/TheoLore/mojoexec/main/jni_bindings/src/main/java/git/artdeell/mojoexec/MojoExec.java
          echo "=== mojoexec overlay done ==="
          grep -n ENABLE_PANVK mojoexec/CMakeLists.txt || echo "WARN: ENABLE_PANVK not found"

      - name: Get LTW
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_mojo/libs

      - name: Get Mesa
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: CopperLauncher/Mesa-AAR-Builder
          workflow: build-aar.yml
          workflow_conclusion: success
          name: mesa.aar
          path: app_mojo/libs

      - name: Get PanVK driver
        continue-on-error: true
        run: |
          set -e
          mkdir -p \
            app_mojo/libs/panvk \
            app_mojo/src/main/jniLibs/arm64-v8a \
            app_mojo/src/main/assets/components/panvk \
            app_mojo/src/main/assets/runtime_mod
          BASE="https://github.com/zenithblue-oss/panvk-kbase-android/releases/download"
          # Prefer RC4 (has experimental jm-v7 for Mali-G52); lowmem is fallback
          for URL in \
            "$BASE/panvk-kbase-v0.1.0-rc4/libvulkan_panfrost-android-aarch64.so" \
            "$BASE/panvk-kbase-v0.1.0-rc4-lowmem/libvulkan_panfrost-android-aarch64.so"
          do
            if curl -fL -o app_mojo/libs/panvk/libvulkan_panfrost.so "$URL"; then
              echo "Downloaded: $URL"
              break
            fi
          done
          if [ -f app_mojo/libs/panvk/libvulkan_panfrost.so ]; then
            # Packaged native lib (shows under nativeLibraryDir / arm64-v8a)
            cp -f app_mojo/libs/panvk/libvulkan_panfrost.so app_mojo/src/main/jniLibs/arm64-v8a/
            # Assets fallback for extraction
            cp -f app_mojo/libs/panvk/libvulkan_panfrost.so app_mojo/src/main/assets/components/panvk/
            cp -f app_mojo/libs/panvk/libvulkan_panfrost.so app_mojo/src/main/assets/runtime_mod/
            ls -la app_mojo/src/main/jniLibs/arm64-v8a/
            ls -la app_mojo/libs/panvk/
            echo "PanVK driver packaged into jniLibs/arm64-v8a + assets"
          else
            echo "WARNING: PanVK .so download failed"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.5"

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Create out directory
        run: mkdir out

      - name: Decode release keystore
        if: github.repository_owner == 'CopperLauncher' && github.event_name != 'pull_request'
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app_mojo/mojo_release_next.jks
          fi

      - name: Decode upload keystore
        if: github.repository_owner == 'CopperLauncher' && (github.ref == 'refs/heads/v3_openjdk' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          if [ -n "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > app_mojo/mojo_upload_next.jks
          fi

      - name: Build Publishing .aab
        if: github.repository_owner == 'CopperLauncher' && (github.ref == 'refs/heads/v3_openjdk' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          gradle :app_mojo:bundleFullGplay
          mv app_mojo/build/outputs/bundle/fullGplay/app_mojo-full-gplay.aab out/app-gplay.aab

      - name: Build Debug .apk
        run: |
          gradle :app_mojo:assembleFullDebug
          mv app_mojo/build/outputs/apk/full/debug/app_mojo-full-debug.apk out/app-debug-full.apk

      - name: Build Debug .apk (No runtime)
        run: |
          gradle :app_mojo:assembleNoruntimeDebug
          mv app_mojo/build/outputs/apk/noruntime/debug/app_mojo-noruntime-debug.apk out/app-debug-noruntime.apk

      - name: Build Release .apk
        if: github.repository_owner == 'CopperLauncher' && github.event_name != 'pull_request'
        run: |
          gradle :app_mojo:assembleFullPubRelease
          mv app_mojo/build/outputs/apk/full/pubRelease/app_mojo-full-pubRelease.apk out/Copper-release.apk

      - name: Gen md5sums
        run: |
          md5sum out/app-debug-full.apk > out/app-debug-full.md5 || true
          md5sum out/app-debug-noruntime.apk > out/app-debug-noruntime.md5 || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: out/app-debug-full.apk

      - name: Upload Debug APK (No runtime)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-noruntime
          path: out/app-debug-noruntime.apk

      - name: Upload Release APK
        if: github.repository_owner == 'CopperLauncher' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: out/Copper-release.apk

      - name: Upload AAB
        if: github.repository_owner == 'CopperLauncher' && (github.ref == 'refs/heads/v3_openjdk' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: out/app-gplay.aab

      - name: Release Nightly APK
        if: github.repository_owner == 'CopperLauncher' && github.ref == 'refs/heads/v3_openjdk'
        uses: softprops/action-gh-release@v3
        with:
          name: Copper Nightly Builds
          prerelease: true
          tag_name: nightly
          body: |
            Copper nightly build.
            Commit hash: ${{ github.sha }}
          files: |
            out/Copper-release.apk

      - name: Upload onto the Google Play testing track
        continue-on-error: true
        if: github.repository_owner == 'CopperLauncher' && github.ref == 'refs/heads/v3_openjdk'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_JSON }}
          packageName: com.maxjubayeryt.copper
          releaseFiles: out/app-gplay.aab
          track: internal
          inAppUpdatePriority: 5
