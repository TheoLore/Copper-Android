name: Android CI

on:
  push:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_NEXT_KEYSTORE_PASSWORD }}
      MOJOPUB_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_NEXT_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init submodules (robust PanVK fork)
        run: |
          git submodule sync || true
          # Clone the known-good submodules
          git submodule update --init --force --depth=1 NoBlocklist glfw sdl || true
          # Force our PanVK-enabled mojoexec (ignore recorded SHA mismatch)
          rm -rf mojoexec
          git clone --depth=1 https://github.com/TheoLore/mojoexec.git mojoexec
          ls -la mojoexec/
          echo "mojoexec HEAD: $(cd mojoexec && git rev-parse HEAD)"

      - name: Get LTW
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_mojo/libs

      - name: Get Mesa
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: CopperLauncher/Mesa-AAR-Builder
          workflow: build-aar.yml
          workflow_conclusion: success
          name: mesa.aar
          path: app_mojo/libs

      - name: Get PanVK (Mali G52 jm-v7)
        continue-on-error: true
        run: |
          mkdir -p app_mojo/libs/panvk app_mojo/src/main/assets/components/panvk
          # Latest RC4 with experimental jm-v7 Bifrost support
          URL="https://github.com/zenithblue-oss/panvk-kbase-android/releases/download/panvk-kbase-v0.1.0-rc4/libvulkan_panfrost-android-aarch64.so"
          curl -fL -o app_mojo/libs/panvk/libvulkan_panfrost.so "$URL" || \
            curl -fL -o app_mojo/libs/panvk/libvulkan_panfrost.so \
              "https://github.com/zenithblue-oss/panvk-kbase-android/releases/download/panvk-kbase-v0.1.0-rc4-lowmem/libvulkan_panfrost-android-aarch64.so" || true
          if [ -f app_mojo/libs/panvk/libvulkan_panfrost.so ]; then
            cp app_mojo/libs/panvk/libvulkan_panfrost.so app_mojo/src/main/assets/components/panvk/
            ls -la app_mojo/libs/panvk/
            echo "PanVK driver downloaded successfully"
            # Also place a copy where MOD_ANDROID_RUNTIME style loaders look
            mkdir -p app_mojo/src/main/assets/runtime_mod
            cp app_mojo/libs/panvk/libvulkan_panfrost.so app_mojo/src/main/assets/runtime_mod/
          else
            echo "WARNING: PanVK .so download failed"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.5"

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Create out directory
        run: mkdir out
      # Release APKs are built on every branch of the main repo (not for pull requests, they don't get secrets)
      - name: Decode release keystore
        if: github.repository_owner == 'CopperLauncher' && github.event_name != 'pull_request'
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app_mojo/mojo_release_next.jks
          fi

      # The Google Play upload key is only needed where the .aab is published
      - name: Decode upload keystore
        if: github.repository_owner == 'CopperLauncher' && (github.ref == 'refs/heads/v3_openjdk' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          if [ -n "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > app_mojo/mojo_upload_next.jks
          fi

      - name: Build Publishing .aab
        if: github.repository_owner == 'CopperLauncher' && (github.ref == 'refs/heads/v3_openjdk' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          gradle :app_mojo:bundleFullGplay
          mv app_mojo/build/outputs/bundle/fullGplay/app_mojo-full-gplay.aab out/app-gplay.aab

      - name: Build Debug .apk
        run: |
          # Build the launcher
          gradle :app_mojo:assembleFullDebug
          mv app_mojo/build/outputs/apk/full/debug/app_mojo-full-debug.apk out/app-debug-full.apk

      - name: Build Debug .apk (No runtime)
        run: |
          gradle :app_mojo:assembleNoruntimeDebug
          mv app_mojo/build/outputs/apk/noruntime/debug/app_mojo-noruntime-debug.apk out/app-debug-noruntime.apk
      - name: Build Release .apk
        if: github.repository_owner == 'CopperLauncher' && github.event_name != 'pull_request'
        run: |
          gradle :app_mojo:assembleFullPubRelease
          mv app_mojo/build/outputs/apk/full/pubRelease/app_mojo-full-pubRelease.apk out/Copper-release.apk
      - name: Gen md5sums
        run: |
          md5sum out/app-debug-full.apk > out/app-debug-full.md5
          md5sum out/app-debug-noruntime.apk > out/app-debug-noruntime.md5

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: out/app-debug-full.apk

      - name: Upload Debug APK (No runtime)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-noruntime
          path: out/app-debug-noruntime.apk

      - name: Upload Release APK
        if: github.repository_owner == 'CopperLauncher' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: out/Copper-release.apk

      - name: Upload AAB
        if: github.repository_owner == 'CopperLauncher' && (github.ref == 'refs/heads/v3_openjdk' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: out/app-gplay.aab

      # Only v3_openjdk publishes the nightly release, other branches just upload the APK as an artifact
      - name: Release Nightly APK
        if: github.repository_owner == 'CopperLauncher' && github.ref == 'refs/heads/v3_openjdk'
        uses: softprops/action-gh-release@v3
        with:
          name: Copper Nightly Builds
          prerelease: true
          tag_name: nightly
          body: |
            Copper nightly build.
            Commit hash: ${{ github.sha }}
          files: |
            out/Copper-release.apk

      - name: Upload onto the Google Play testing track
        continue-on-error: true
        if: github.repository_owner == 'CopperLauncher' && github.ref == 'refs/heads/v3_openjdk'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_JSON }}
          packageName: com.maxjubayeryt.copper
          releaseFiles: out/app-gplay.aab
          track: internal
          inAppUpdatePriority: 5
